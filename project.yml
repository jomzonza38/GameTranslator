name: GameTranslator
options:
  bundleIdPrefix: com.worawalan
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  GameTranslator:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    resources:
      - path: Resources
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/GameTranslator.entitlements
        CODE_SIGN_IDENTITY: "-"
        ENABLE_DEBUG_DYLIB: NO
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: com.worawalan.GameTranslator
        PRODUCT_NAME: GameTranslator
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Resources/GameTranslator.entitlements
